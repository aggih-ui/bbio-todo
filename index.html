<!doctype html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Það sem þarf að gera</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #020617;
  color: #f8fafc;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
}

body {
  background:
    radial-gradient(circle at 85% 0, rgba(220,38,38,.26), transparent 30%),
    linear-gradient(135deg, #020617, #0f172a 58%, #000);
}

.screen {
  width: 1920px;
  min-height: 1080px;
  position: relative;
  
  transform-origin: top left;
  padding: 10px;
  display: grid;
  grid-template-rows: 70px 1fr 20px;
  gap: 7px;
  background:
    radial-gradient(circle at 85% 0, rgba(220,38,38,.26), transparent 30%),
    linear-gradient(135deg, rgba(2,6,23,.92), rgba(15,23,42,.94) 58%, rgba(0,0,0,.96));
  overflow: visible;
}

header, footer, .dayBox {
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(0,0,0,.36);
  backdrop-filter: blur(3px);
}

header {
  border-radius: 10px;
  padding: 7px 12px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: start;
  overflow-x: hidden;
}

.logoWrap {
  width: 112px;
  height: 46px;
  border-radius: 10px;
  background: rgba(255,255,255,.90);
  display: none;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

.logoWrap.show {
  display: flex;
}

.logoWrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

h1 {
  margin: 0;
  font-size: 30px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -1px;
  white-space: normal;
}

.subtitle {
  margin-top: 5px;
  font-size: 10px;
  color: rgba(255,255,255,.72);
  font-weight: 800;
  white-space: normal;
}

.headerRight {
  text-align: right;
  flex-shrink: 0;
}

.clock {
  white-space: nowrap;
  font-size: 26px;
  line-height: 1;
  font-weight: 900;
}

.updated {
  margin-top: 5px;
  font-size: 9px;
  color: rgba(255,255,255,.68);
  font-weight: 800;
}

main {
  min-height: auto;
  overflow: visible;
  display: grid;
  grid-auto-rows: minmax(0, auto);
  gap: 9px;
  align-content: start;
}

.dayBox {
  border-radius: 10px;
  overflow: visible;
  min-height: auto;
}

.dayTitle {
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #b91c1c;
  padding: 0 11px;
  font-size: 18px;
  line-height: 1;
  font-weight: 900;
  text-transform: capitalize;
}

.dayCount {
  white-space: nowrap;
  font-size: 9px;
  background: rgba(255,255,255,.18);
  border-radius: 999px;
  padding: 4px 9px;
}

.items {
  padding: 6px;
  display: grid;
  gap: 4px;
}

.items.many {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.items.veryMany {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.items.veryMany .item {
  grid-template-columns: 50px minmax(0,1fr) 62px;
  min-height: 40px;
}

.items.veryMany .time {
  font-size: 14px;
}

.items.veryMany .task {
  font-size: 12px;
}

.items.veryMany .details {
  font-size: 8px;
}

.items.veryMany .status {
  font-size: 8px;
  padding: 3px 3px;
}

.items.veryMany .commentInline {
  display: none;
}

.items.veryMany .commentBlock {
  display: block;
  margin-top: 1px;
  font-size: 7.5px;
  line-height: 1.02;
  color: rgba(255,255,255,.82);
  font-weight: 800;
  white-space: normal;

}

.items.many .item {
  grid-template-columns: 56px minmax(0,1fr) 72px;
  min-height: 46px;
}

.items.many .time {
  font-size: 13.5px;
}

.items.many .task {
  font-size: 13.5px;
}

.items.many .details {
  font-size: 9px;
}

.items.many .status {
  font-size: 9.5px;
  padding: 4px 4px;
}

.item {
  position: relative;
  min-height: 48px;
  display: grid;
  grid-template-columns: 66px minmax(0,1fr) 88px;
  gap: 7px;
  align-items: start;
  background: rgba(30,41,59,.98);
  border-left: 6px solid #dc2626;
  border-radius: 10px;
  padding: 6px 8px;
  overflow-x: hidden;
}

.item.overdue {
  background: rgba(127,29,29,.96);
  border-left-color: #ef4444;
}

/* Ólokið verkefni sem hefur færst frá eldri degi */
.item.carried {
  background: rgba(88,28,135,.96);
  border-left-color: #c084fc;
}

/* Staða: Í vinnslu */
.item.inProgress {
  background: rgba(161,98,7,.96);
  border-left-color: #facc15;
}

/* Staða: Lokið */
.item.done {
  background: rgba(22,101,52,.96);
  border-left-color: #4ade80;
  opacity: 1;
}

.time {
  white-space: nowrap;
  text-align: center;
  font-size: 15.5px;
  line-height: 1;
  font-weight: 900;
  white-space: normal;
}

.task {
  font-size: 15.5px;
  line-height: 1.05;
  font-weight: 900;
  white-space: normal;

}

.details {
  margin-top: 4px;
  font-size: 10px;
  line-height: 1.1;
  color: rgba(255,255,255,.72);
  font-weight: 800;
  white-space: normal;

}

.details strong {
  color: white;
}

.commentInline {
  color: rgba(255,255,255,.84);
  font-weight: 900;
}

.commentBlock {
  display: none;
}

.items.many .commentInline {
  display: none;
}

.items.many .commentBlock {
  display: block;
  margin-top: 3px;
  font-size: 9px;
  line-height: 1.08;
  color: rgba(255,255,255,.82);
  font-weight: 800;
  white-space: normal;

}

.items.many .commentBlock strong {
  color: white;
}

.sourceTag {
  opacity: .75;
}

.carriedTag {
  color: #e9d5ff;
  font-weight: 900;
}

.status {
  white-space: nowrap;
  justify-self: stretch;
  text-align: center;
  border-radius: 999px;
  background: rgba(2,6,23,.82);
  padding: 5px 5px;
  font-size: 9px;
  line-height: 1;
  font-weight: 900;
  white-space: normal;

}

.overdue .status {
  background: #dc2626;
}

.carried .status {
  background: #7e22ce;
}

.inProgress .status {
  background: #facc15;
  color: #111827;
}

.done .status {
  background: #16a34a;
  color: white;
}

.empty, .error {
  height: 100%;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 30px;
  line-height: 1.2;
  font-weight: 900;
  color: rgba(255,255,255,.72);
}

.error {
  color: #fecaca;
}

.emptyScreen {
  height: 100%;
  display: grid;
  place-items: center;
  text-align: center;
}

.emptyCard {
  display: grid;
  gap: 22px;
  justify-items: center;
}

.emptyLogo {
  max-width: 760px;
  max-height: 390px;
  object-fit: contain;
}

.emptyText {
  font-size: 26px;
  line-height: 1.15;
  font-weight: 900;
}

footer {
  border-radius: 9px;
  padding: 3px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: rgba(255,255,255,.64);
  font-size: 10px;
  font-weight: 800;
  overflow-x: hidden;
}

@media (max-width: 1000px) {
  .screen {
    width: 100vw;
    height: 100vh;
    position: relative;
    transform: none !important;
    padding: 10px;
    grid-template-rows: auto 1fr auto;
  }

  header {
    grid-template-columns: 1fr;
  }

  .logoWrap {
    width: 120px;
    height: 52px;
  }

  .headerRight {
    text-align: left;
  }

  h1 {
    font-size: 29px;
    white-space: normal;
  }

  .items.many {
    grid-template-columns: 1fr;
  }

  .item,
  .items.many .item {
    grid-template-columns: 68px 1fr;
  }

  .status {
    grid-column: 1 / -1;
  }

  .task,
  .details {
    white-space: normal;
  }
}
</style>
</head>
<body>
<div class="screen" id="screen">
  <header>
    <div class="logoWrap" id="logoWrap">
      <img id="logoImg" alt="Logo">
    </div>

    <div>
      <h1 id="title">Það sem þarf að gera</h1>
      <div class="subtitle" id="subtitle">Sæki gögn úr Google Sheet...</div>
    </div>

    <div class="headerRight">
      <div class="clock" id="clock">--:--</div>
      <div class="updated">Uppfært: <span id="updated">—</span></div>
    </div>
  </header>

  <main id="content">
    <div class="empty">Sæki tímaáætlun...</div>
  </main>

  <footer>
    <span>Live Google Sheet · Sjálfvirk yfirfærsla · TODO + Vinnuplan · F11</span>
    <span id="apiStatus">API</span>
  </footer>
</div>

<script>
const CONFIG = {
  API_BASE: "https://script.google.com/macros/s/AKfycbwdrNAHrEcQbH5UpeCO-pOX611s-E7sbF9k86ekQggyFiJBYbzbh8OIXXDD3ruC_gLx/exec",
  DEFAULT_DAYS: 30,
  REFRESH_MS: 60000,
  FALLBACK_TITLE: "Það sem þarf að gera"
};

const urlParams = new URLSearchParams(window.location.search);
const DAYS = Number(urlParams.get("days") || CONFIG.DEFAULT_DAYS);

function buildApiUrl() {
  const params = new URLSearchParams({
    days: DAYS
  });
  return `${CONFIG.API_BASE}?${params.toString()}`;
}

function fit() {
  // Engin föst hæð/scale hér.
  // Skjárinn má lengjast niður svo engin lína týnist.
  const screen = document.getElementById("screen");
  screen.style.transform = "none";
}

function esc(value) {
  return String(value || "").replace(/[&<>"]/g, function(s) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;"
    }[s];
  });
}

function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("is-IS", { hour: "2-digit", minute: "2-digit" });
}

async function load() {
  try {
    document.getElementById("apiStatus").textContent = "Sæki gögn...";
    const res = await fetch(buildApiUrl(), { cache: "no-store" });
    const data = await res.json();

    if (!data.success) {
      throw new Error(data.error || "API villa");
    }

    render(data);
  } catch (e) {
    document.getElementById("content").innerHTML =
      `<div class="error">Villa við að sækja gögn:<br>${esc(e.message || e)}</div>`;
    document.getElementById("apiStatus").textContent = "Villa";
  }
}

function applyBranding(info) {
  info = info || {};

  const screen = document.getElementById("screen");
  const logoWrap = document.getElementById("logoWrap");
  const logoImg = document.getElementById("logoImg");

  if (info.logo) {
    logoImg.src = info.logo;
    logoWrap.classList.add("show");
  } else {
    logoImg.removeAttribute("src");
    logoWrap.classList.remove("show");
  }

  if (info.background) {
    const img = new Image();

    img.onload = function() {
      screen.style.background =
        `linear-gradient(135deg, rgba(2,6,23,.64), rgba(15,23,42,.72) 58%, rgba(0,0,0,.82)), url("${info.background}") center center / cover no-repeat`;
    };

    img.onerror = function() {
      screen.style.background =
        `radial-gradient(circle at 85% 0, rgba(220,38,38,.26), transparent 30%), linear-gradient(135deg, rgba(2,6,23,.92), rgba(15,23,42,.94) 58%, rgba(0,0,0,.96))`;
    };

    img.src = info.background;
  } else {
    screen.style.background =
      `radial-gradient(circle at 85% 0, rgba(220,38,38,.26), transparent 30%), linear-gradient(135deg, rgba(2,6,23,.92), rgba(15,23,42,.94) 58%, rgba(0,0,0,.96))`;
  }
}

function render(data) {
  const info = data.info || {};
  const groups = data.groups || [];

  applyBranding(info);

  document.getElementById("title").textContent =
    "Það sem þarf að gera";

  document.getElementById("updated").textContent =
    new Date(data.generatedAt).toLocaleTimeString("is-IS", {
      hour: "2-digit",
      minute: "2-digit"
    });

  const total = groups.reduce(function(sum, group) {
    return sum + (group.items ? group.items.length : 0);
  }, 0);

  document.getElementById("subtitle").textContent =
    total ? `Sýnir ${total} atriði úr TODO og Vinnuplan í tímaröð` : "Ekkert skráð á þessu tímabili";

  document.getElementById("apiStatus").textContent =
    `Live gögn · ${total} atriði`;

  if (!groups.length) {
    const emptyLogo = info.emptyLogo
      ? `<img class="emptyLogo" src="${esc(info.emptyLogo)}" alt="Logo">`
      : "";

    document.getElementById("content").innerHTML = `
      <div class="emptyScreen">
        <div class="emptyCard">
          ${emptyLogo}
          <div class="emptyText">Ekkert skráð næstu ${data.days} daga</div>
        </div>
      </div>
    `;
    return;
  }

  let html = "";

  groups.forEach(function(group) {
    const items = group.items || [];

    const manyClass = items.length >= 1 ? " veryMany" : "";

    html += `<section class="dayBox">`;
    html += `<div class="dayTitle"><span>${esc(group.title)}</span><span class="dayCount">${items.length}</span></div>`;
    html += `<div class="items${manyClass}">`;

    items.forEach(function(item) {
      const cls = [
        "item",
        item.isOverdue ? "overdue" : "",
        item.isCarriedForward ? "carried" : "",
        item.isInProgress ? "inProgress" : "",
        item.isDone ? "done" : ""
      ].join(" ");

      const details = [];
      if (item.responsible) details.push(`<strong>Ábyrgur:</strong> ${esc(item.responsible)}`);
      if (item.people) details.push(`<strong>Fólk:</strong> ${esc(item.people)}`);
      if (item.area) details.push(`<strong>Svæði:</strong> ${esc(item.area)}`);
      if (item.category) details.push(`<strong>Flokkur:</strong> ${esc(item.category)}`);
      if (item.comment) details.push(`<span class="commentInline"><strong>Athugasemd:</strong> ${esc(item.comment)}</span>`);
      if (item.isCarriedForward && item.originalDayTitle) {
        details.push(`<span class="carriedTag">Fært frá: ${esc(item.originalDayTitle)}</span>`);
      }
      if (item.source) details.push(`<span class="sourceTag">${esc(item.source)}</span>`);

      const commentBlock = item.comment
        ? `<div class="commentBlock"><strong>Athugasemd:</strong> ${esc(item.comment)}</div>`
        : "";

      html += `
        <article class="${cls}">
          <div class="time">${esc(item.timeText || "")}</div>
          <div>
            <div class="task">${esc(item.task || "")}</div>
            <div class="details">${details.join(" &nbsp; | &nbsp; ")}</div>
            ${commentBlock}
          </div>
          <div class="status">${esc(item.status || "TODO")}</div>
        </article>
      `;
    });

    html += `</div></section>`;
  });

  document.getElementById("content").innerHTML = html;
}

window.addEventListener("resize", fit);
window.addEventListener("load", fit);

updateClock();
fit();
load();

setInterval(updateClock, 1000);
setInterval(load, CONFIG.REFRESH_MS);
</script>
</body>
</html>
